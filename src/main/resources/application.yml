spring:
  application:
    name: mediturno-backend
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/mediturno?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:mediturno}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

app:
  timezone: ${APP_TIMEZONE:America/Lima}
  appointments:
    min-notice-minutes: ${APPOINTMENT_MIN_NOTICE_MINUTES:30}
  bootstrap:
    admin-email: ${ADMIN_EMAIL:}
    admin-password: ${ADMIN_PASSWORD:}
  demo:
    password: ${DEMO_PASSWORD:}
  auth:
    registration-enabled: ${AUTH_REGISTRATION_ENABLED:true}
  jwt:
    secret: ${JWT_SECRET:}
    expiration-ms: ${JWT_EXPIRATION_MS:3600000}

  cors:
    allowed-origin-patterns: ${CORS_ALLOWED_ORIGINS:http://localhost:*}